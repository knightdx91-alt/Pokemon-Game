<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pokémon Crater</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔴</text></svg>">
<style>
  :root{
    --bg:#0d1020; --panel:#161a2e; --panel2:#1e2340; --accent:#ef5350; --accent2:#42a5f5;
    --text:#e8ecff; --muted:#8b93b8; --gold:#ffd54f; --green:#66bb6a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(circle at 30% 10%,#1a1f3a,#0d1020 60%);
    color:var(--text); font-family:'Segoe UI',system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100%;
    overflow-x:hidden; user-select:none;
  }
  #wrap{width:100%;max-width:520px;padding:8px;display:flex;flex-direction:column;gap:8px;}
  header{display:flex;align-items:center;gap:10px;padding:4px 6px;}
  header .logo{font-size:20px;font-weight:800;letter-spacing:.5px;}
  header .logo b{color:var(--accent);}
  header .logo i{color:var(--accent2);font-style:normal;}
  header a.back{margin-left:auto;color:var(--muted);text-decoration:none;font-size:13px;
    border:1px solid #2a2f4d;border-radius:8px;padding:5px 10px;}
  #stage{position:relative;width:100%;aspect-ratio:15/11;background:#000;border-radius:12px;
    overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 0 3px #23284a;}
  canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block;}

  /* HUD banner */
  #banner{position:absolute;top:6px;left:6px;background:rgba(10,12,26,.78);
    border:1px solid #2a2f4d;border-radius:8px;padding:4px 9px;font-size:11px;
    display:flex;gap:10px;align-items:center;pointer-events:none;}
  #banner .money{color:var(--gold);}

  /* Controls */
  #controls{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 12px;}
  .dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:2px;}
  .dpad button{background:var(--panel2);border:1px solid #2a2f4d;border-radius:9px;color:var(--text);
    font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .dpad button:active{background:var(--accent);}
  .dpad .sp{visibility:hidden;}
  .abtns{display:flex;flex-direction:column;gap:12px;align-items:flex-end;}
  .abtn{width:58px;height:58px;border-radius:50%;border:none;font-weight:800;font-size:15px;color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,.35);}
  .abtn.a{background:linear-gradient(#66bb6a,#43a047);}
  .abtn.b{background:linear-gradient(#ef5350,#c62828);width:48px;height:48px;font-size:13px;}
  .abtn:active{transform:translateY(3px);box-shadow:none;}
  .menu-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
  .mbtn{background:var(--panel);border:1px solid #2a2f4d;color:var(--text);border-radius:9px;
    padding:8px 12px;font-size:13px;font-weight:600;flex:1;min-width:70px;text-align:center;}
  .mbtn:active{background:var(--panel2);}

  /* Generic overlay panels */
  .overlay{position:absolute;inset:0;background:rgba(6,8,18,.92);z-index:20;display:none;
    flex-direction:column;padding:14px;overflow-y:auto;}
  .overlay.show{display:flex;}
  .overlay h2{margin:0 0 10px;font-size:16px;}
  .row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid #2a2f4d;
    border-radius:10px;padding:8px 10px;margin-bottom:7px;}
  .row img{width:48px;height:48px;image-rendering:pixelated;}
  .row .info{flex:1;min-width:0;}
  .row .nm{font-weight:700;font-size:13px;}
  .row .sub{font-size:11px;color:var(--muted);}
  .hpbar{height:6px;border-radius:4px;background:#333;overflow:hidden;margin-top:3px;}
  .hpbar i{display:block;height:100%;background:var(--green);transition:width .3s;}
  .btn{background:var(--accent2);color:#fff;border:none;border-radius:9px;padding:9px 14px;
    font-weight:700;font-size:13px;}
  .btn.grey{background:var(--panel2);}
  .close-x{position:absolute;top:10px;right:12px;font-size:22px;color:var(--muted);background:none;border:none;}

  /* Dialogue */
  #dialogue{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(10,12,26,.96);
    border:2px solid var(--accent2);border-radius:10px;padding:10px 12px;font-size:14px;z-index:15;
    display:none;min-height:46px;box-shadow:0 4px 16px rgba(0,0,0,.5);}
  #dialogue.show{display:block;}
  #dialogue .more{position:absolute;right:10px;bottom:6px;color:var(--accent2);animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.2}}

  /* Battle */
  #battle{position:absolute;inset:0;z-index:25;display:none;flex-direction:column;
    background:linear-gradient(#7ec0ee,#aee1c9 60%,#8fd18f);}
  #battle.show{display:flex;}
  #battle .field{position:relative;flex:1;overflow:hidden;}
  .mon{position:absolute;display:flex;flex-direction:column;align-items:center;}
  .mon img{width:96px;height:96px;image-rendering:pixelated;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3));}
  .foe{top:8%;right:6%;}
  .ally{bottom:2%;left:6%;}
  .statusbox{background:rgba(255,255,255,.92);border:2px solid #333;border-radius:8px;padding:5px 9px;
    min-width:135px;color:#111;font-size:11px;box-shadow:2px 2px 0 rgba(0,0,0,.2);}
  .foe .statusbox{position:absolute;top:10px;left:10px;}
  .ally .statusbox{position:absolute;bottom:14px;right:10px;text-align:right;}
  .statusbox .bn{font-weight:800;display:flex;justify-content:space-between;gap:8px;}
  .statusbox .bar{height:7px;border-radius:4px;background:#555;overflow:hidden;margin-top:3px;}
  .statusbox .bar i{display:block;height:100%;background:var(--green);transition:width .4s;}
  .statusbox .xp{height:3px;background:#555;border-radius:2px;overflow:hidden;margin-top:2px;}
  .statusbox .xp i{display:block;height:100%;background:var(--accent2);}
  #battle .ui{background:#161a2e;border-top:3px solid #23284a;padding:8px;min-height:118px;}
  #btxt{font-size:14px;min-height:40px;padding:4px 6px;line-height:1.35;}
  #bmenu{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  #bmenu button{background:var(--panel2);border:1px solid #2a2f4d;color:var(--text);border-radius:8px;
    padding:11px;font-weight:700;font-size:13px;}
  #bmenu button:active{background:var(--accent);}
  #bmenu button small{display:block;font-weight:500;color:var(--muted);font-size:10px;margin-top:2px;}
  .throw{position:absolute;width:26px;height:26px;z-index:5;}

  /* Title */
  #title{position:absolute;inset:0;z-index:40;background:radial-gradient(circle at 50% 30%,#2a3566,#0d1020);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center;}
  #title h1{font-size:34px;margin:0;font-weight:900;text-shadow:0 3px 0 #000;}
  #title h1 b{color:var(--accent);} #title h1 i{color:var(--accent2);font-style:normal;}
  #title p{color:var(--muted);margin:0;font-size:13px;max-width:300px;}
  .starter{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .starter .pick{background:var(--panel);border:2px solid #2a2f4d;border-radius:12px;padding:8px;width:96px;}
  .starter .pick img{width:74px;height:74px;image-rendering:pixelated;}
  .starter .pick.sel{border-color:var(--gold);background:var(--panel2);}
  .starter .pick .n{font-size:12px;font-weight:700;}
  .toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;
    background:rgba(10,12,26,.95);border:1px solid var(--gold);border-radius:10px;padding:14px 18px;
    font-size:14px;display:none;text-align:center;max-width:80%;}
  .flex{display:flex;gap:8px;}
  .grow{flex:1;}
  .center{text-align:center;}
  .small{font-size:11px;color:var(--muted);}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="logo"><b>POKéMON</b> <i>CRATER</i></div>
    <a class="back" href="index.html">‹ Hub</a>
  </header>

  <div id="stage">
    <canvas id="cv" width="480" height="352"></canvas>
    <div id="banner"><span id="loc">Crater Town</span><span class="money">₽<span id="money">3000</span></span></div>

    <div id="dialogue"><span id="dtext"></span><span class="more">▾</span></div>

    <!-- Battle screen -->
    <div id="battle">
      <div class="field">
        <div class="mon foe" id="foeMon">
          <div class="statusbox">
            <div class="bn"><span id="foeName">—</span><span id="foeLv">L5</span></div>
            <div class="bar"><i id="foeHp" style="width:100%"></i></div>
          </div>
          <img id="foeImg" alt="">
        </div>
        <div class="mon ally" id="allyMon">
          <img id="allyImg" alt="">
          <div class="statusbox">
            <div class="bn"><span id="allyName">—</span><span id="allyLv">L5</span></div>
            <div class="bar"><i id="allyHp" style="width:100%"></i></div>
            <div class="xp"><i id="allyXp" style="width:0%"></i></div>
            <div style="text-align:right;font-weight:700" id="allyHpTxt">20/20</div>
          </div>
        </div>
      </div>
      <div class="ui">
        <div id="btxt">A wild Pokémon appeared!</div>
        <div id="bmenu"></div>
      </div>
    </div>

    <!-- Party overlay -->
    <div class="overlay" id="party">
      <button class="close-x" data-close="party">×</button>
      <h2>🎒 Party</h2>
      <div id="partyList"></div>
    </div>

    <!-- Bag overlay -->
    <div class="overlay" id="bag">
      <button class="close-x" data-close="bag">×</button>
      <h2>👜 Bag</h2>
      <div id="bagList"></div>
    </div>

    <!-- Pokédex overlay -->
    <div class="overlay" id="dex">
      <button class="close-x" data-close="dex">×</button>
      <h2>📕 Pokédex <span class="small" id="dexCount"></span></h2>
      <div id="dexList" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;"></div>
    </div>

    <!-- Title / new game -->
    <div id="title">
      <h1><b>POKéMON</b> <i>CRATER</i></h1>
      <p>A meteor carved a crater teeming with wild Pokémon. Explore, battle, and catch them all — right in your browser.</p>
      <div id="titleBody"></div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <div id="controls">
    <div class="dpad">
      <button class="sp"></button><button data-dir="up">▲</button><button class="sp"></button>
      <button data-dir="left">◀</button><button class="sp"></button><button data-dir="right">▶</button>
      <button class="sp"></button><button data-dir="down">▼</button><button class="sp"></button>
    </div>
    <div class="abtns">
      <button class="abtn a" id="btnA">A</button>
      <button class="abtn b" id="btnB">B</button>
    </div>
  </div>
  <div class="menu-row">
    <button class="mbtn" data-open="party">🎒 Party</button>
    <button class="mbtn" data-open="bag">👜 Bag</button>
    <button class="mbtn" data-open="dex">📕 Dex</button>
    <button class="mbtn" id="saveBtn">💾 Save</button>
  </div>
</div>

<script>
'use strict';
//=================================================================================
//  Pokémon Crater — self-contained browser clone
//  Uses this repo's data (base_stats, moves, learnsets, pokedex) + PokeAPI sprites
//=================================================================================
const TILE=32, VIEW_W=15, VIEW_H=11;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);

//---------------------------------------------------------------- data loading
let DEX={}, STATS={}, MOVES={}, LEARN={}, NAME2NUM={}, SPRITE={};
async function loadData(){
  const base='data/pokemon/';
  const [dex,stats,moves,learn]=await Promise.all([
    fetch(base+'pokedex.json').then(r=>r.json()),
    fetch(base+'base_stats.json').then(r=>r.json()),
    fetch(base+'moves.json').then(r=>r.json()),
    fetch(base+'learnsets.json').then(r=>r.json()),
  ]);
  DEX=dex; STATS=stats; MOVES=moves; LEARN=learn;
  for(const k in dex){ if(dex[k].num>0) NAME2NUM[k]=dex[k].num; }
}
function num(sp){ return NAME2NUM[sp.toLowerCase()]||0; }
function spriteURL(sp,back){
  const n=num(sp); if(!n) return '';
  const b=back?'back/':'';
  return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${b}${n}.png`;
}

//---------------------------------------------------------------- type chart
const TYPES=['Normal','Fire','Water','Electric','Grass','Ice','Fighting','Poison','Ground','Flying','Psychic','Bug','Rock','Ghost','Dragon','Dark','Steel','Fairy'];
// effectiveness of attacker(row) vs defender(col): 0=immune,0.5,1,2
const TC={
 Normal:{Rock:.5,Ghost:0,Steel:.5},
 Fire:{Fire:.5,Water:.5,Grass:2,Ice:2,Bug:2,Rock:.5,Dragon:.5,Steel:2},
 Water:{Fire:2,Water:.5,Grass:.5,Ground:2,Rock:2,Dragon:.5},
 Electric:{Water:2,Electric:.5,Grass:.5,Ground:0,Flying:2,Dragon:.5},
 Grass:{Fire:.5,Water:2,Grass:.5,Poison:.5,Ground:2,Flying:.5,Bug:.5,Rock:2,Dragon:.5,Steel:.5},
 Ice:{Fire:.5,Water:.5,Grass:2,Ice:.5,Ground:2,Flying:2,Dragon:2,Steel:.5},
 Fighting:{Normal:2,Ice:2,Poison:.5,Flying:.5,Psychic:.5,Bug:.5,Rock:2,Ghost:0,Dark:2,Steel:2,Fairy:.5},
 Poison:{Grass:2,Poison:.5,Ground:.5,Rock:.5,Ghost:.5,Steel:0,Fairy:2},
 Ground:{Fire:2,Electric:2,Grass:.5,Poison:2,Flying:0,Bug:.5,Rock:2,Steel:2},
 Flying:{Electric:.5,Grass:2,Fighting:2,Bug:2,Rock:.5,Steel:.5},
 Psychic:{Fighting:2,Poison:2,Psychic:.5,Dark:0,Steel:.5},
 Bug:{Fire:.5,Grass:2,Fighting:.5,Poison:.5,Flying:.5,Psychic:2,Ghost:.5,Dark:2,Steel:.5,Fairy:.5},
 Rock:{Fire:2,Ice:2,Fighting:.5,Ground:.5,Flying:2,Bug:2,Steel:.5},
 Ghost:{Normal:0,Psychic:2,Ghost:2,Dark:.5},
 Dragon:{Dragon:2,Steel:.5,Fairy:0},
 Dark:{Fighting:.5,Psychic:2,Ghost:2,Dark:.5,Fairy:.5},
 Steel:{Fire:.5,Water:.5,Electric:.5,Ice:2,Rock:2,Steel:.5,Fairy:2},
 Fairy:{Fire:.5,Fighting:2,Poison:.5,Dragon:2,Dark:2,Steel:.5},
};
function eff(atkType,defTypes){
  let m=1; for(const d of defTypes){ const r=TC[atkType]; if(r&&d in r) m*=r[d]; } return m;
}

//---------------------------------------------------------------- world map
// generated procedurally; codes: 0 grass, 1 tall grass, 2 tree, 3 water, 4 path, 5 sand, 6 center(heal), 7 shop, 8 flower
const MAP_W=48, MAP_H=40;
let world=[];
function rng(seed){ return function(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }; }
function genWorld(){
  const r=rng(1337);
  world=[];
  for(let y=0;y<MAP_H;y++){ const row=[]; for(let x=0;x<MAP_W;x++){
    let t=0;
    if(x===0||y===0||x===MAP_W-1||y===MAP_H-1) t=2; // border trees
    else if(r()<0.03) t=8; // flowers
    row.push(t);
  } world.push(row); }
  // helper
  const set=(x,y,t)=>{ if(x>0&&y>0&&x<MAP_W-1&&y<MAP_H-1) world[y][x]=t; };
  const blob=(cx,cy,rad,t)=>{ for(let y=cy-rad;y<=cy+rad;y++)for(let x=cx-rad;x<=cx+rad;x++){
    if((x-cx)**2+(y-cy)**2<=rad*rad+r()*3) set(x,y,t); } };
  // tall-grass patches
  const patches=[[10,8,3],[34,10,4],[20,26,4],[40,30,3],[8,32,3],[28,6,3],[16,18,3],[38,20,3]];
  for(const[px,py,pr] of patches) blob(px,py,pr,1);
  // water lake
  blob(40,8,4,3); blob(6,22,3,3);
  // tree clusters (obstacles)
  for(let i=0;i<40;i++){ const x=2+Math.floor(r()*(MAP_W-4)), y=2+Math.floor(r()*(MAP_H-4));
    if(world[y][x]===0) blob(x,y,1+Math.floor(r()*2),2); }
  // Town in the center-left
  for(let y=14;y<=20;y++)for(let x=20;x<=28;x++) set(x,y,4); // plaza path
  set(23,15,6); // Pokémon Center
  set(25,15,7); // Shop
  // paths radiating out
  for(let x=1;x<24;x++) set(x,17,4);
  for(let x=24;x<MAP_W-1;x++) set(x,17,4);
  for(let y=1;y<15;y++) set(24,y,4);
  for(let y=20;y<MAP_H-1;y++) set(24,y,4);
  // clear spawn
  set(24,18,4);
}
// tile passability
function blocked(x,y){
  if(x<0||y<0||x>=MAP_W||y>=MAP_H) return true;
  const t=world[y][x];
  return t===2||t===3;
}
function isTallGrass(x,y){ return world[y]&&world[y][x]===1; }

//---------------------------------------------------------------- game state
let G=null;
function newGame(starter){
  G={
    x:24,y:18,dir:'down',
    money:3000,
    party:[ makeMon(starter,5) ],
    box:[],
    bag:{'Poké Ball':5,'Potion':3,'Great Ball':0,'Super Potion':0,'Revive':0},
    seen:{}, caught:{},
    steps:0,
  };
  G.seen[starter]=1; G.caught[starter]=1;
  save();
}
function makeMon(species,level){
  const s=STATS[species]; if(!s) return null;
  const iv=()=>Math.floor(Math.random()*16);
  const ivs={hp:iv(),atk:iv(),def:iv(),spa:iv(),spd:iv(),spe:iv()};
  const m={species,level,exp:expForLevel(level),ivs,moves:pickMoves(species,level),status:null};
  const st=calcStats(m); m.maxhp=st.hp; m.hp=st.hp;
  return m;
}
function calcStats(m){
  const s=STATS[m.species], L=m.level;
  const f=(base,iv)=>Math.floor(((2*base+iv)*L)/100)+5;
  return {
    hp:Math.floor(((2*s.base_hp+m.ivs.hp)*L)/100)+L+10,
    atk:f(s.base_attack,m.ivs.atk), def:f(s.base_defense,m.ivs.def),
    spa:f(s.base_sp_attack,m.ivs.spa), spd:f(s.base_sp_defense,m.ivs.spd),
    spe:f(s.base_speed,m.ivs.spe),
  };
}
function pickMoves(species,level){
  const ls=LEARN[species.toLowerCase()]||[];
  const learned=ls.filter(e=>e[0]<=level).map(e=>e[1]).filter(mv=>MOVES[mv]);
  const uniq=[...new Set(learned)];
  let mv=uniq.slice(-4);
  if(mv.length===0) mv=['tackle'].filter(x=>MOVES[x]);
  if(mv.length===0) mv=[Object.keys(MOVES)[0]];
  return mv.map(id=>({id,pp:MOVES[id].pp,maxpp:MOVES[id].pp}));
}
// exp: medium-fast n^3
function expForLevel(l){ return l*l*l; }
function levelForExp(e){ let l=1; while(expForLevel(l+1)<=e && l<100) l++; return l; }

//---------------------------------------------------------------- save/load
const SKEY='crater_save_v1';
function save(){ try{ localStorage.setItem(SKEY,JSON.stringify(G)); flash('Saved!'); }catch(e){} }
function load(){ try{ const s=localStorage.getItem(SKEY); if(s){ G=JSON.parse(s); return true; } }catch(e){} return false; }

//---------------------------------------------------------------- rendering
const spriteCache={};
function ovSprite(url){ if(!url) return null; if(spriteCache[url]) return spriteCache[url];
  const img=new Image(); img.crossOrigin='anonymous'; img.src=url; spriteCache[url]=img; return img; }

const COL={0:'#4caf50',1:'#2e7d32',2:'#1b5e20',3:'#4fa3e0',4:'#c9b58a',5:'#e0d19a',8:'#4caf50'};
function drawTile(t,px,py){
  ctx.fillStyle=COL[t]||'#4caf50';
  ctx.fillRect(px,py,TILE,TILE);
  if(t===1){ // tall grass texture
    ctx.fillStyle='#1b5e20';
    for(let i=0;i<5;i++){ const gx=px+3+i*6; ctx.fillRect(gx,py+20,2,10); ctx.fillRect(gx+2,py+16,2,14);}
  } else if(t===2){ // tree
    ctx.fillStyle='#4caf50'; ctx.fillRect(px,py,TILE,TILE);
    ctx.fillStyle='#2e7d32'; ctx.beginPath(); ctx.arc(px+16,py+13,13,0,7); ctx.fill();
    ctx.fillStyle='#1b5e20'; ctx.beginPath(); ctx.arc(px+16,py+11,10,0,7); ctx.fill();
    ctx.fillStyle='#6d4c41'; ctx.fillRect(px+13,py+22,6,8);
  } else if(t===3){ // water shimmer
    ctx.fillStyle='#3d8fd0'; const o=(Date.now()/400)%TILE;
    ctx.fillRect(px,py+((o|0)%TILE),TILE,3);
  } else if(t===8){ // flowers
    ctx.fillStyle='#4caf50'; ctx.fillRect(px,py,TILE,TILE);
    const cs=['#ffeb3b','#e91e63','#fff'];
    for(let i=0;i<3;i++){ ctx.fillStyle=cs[i]; ctx.beginPath(); ctx.arc(px+8+i*9,py+10+((i*7)%14),3,0,7); ctx.fill();}
  } else if(t===6){ // center
    ctx.fillStyle='#e57373'; ctx.fillRect(px+2,py+6,TILE-4,TILE-8);
    ctx.fillStyle='#fff'; ctx.fillRect(px+13,py+2,6,10);
    ctx.fillStyle='#e53935'; ctx.fillRect(px+13,py+3,6,3);

    ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif'; ctx.fillText('🛒',px+8,py+22);
  }
}
function drawPlayer(px,py){
  // simple trainer: red cap, skin, body
  ctx.fillStyle='#d32f2f'; ctx.fillRect(px+9,py+3,14,7);       // cap
  ctx.fillStyle='#ffcc80'; ctx.fillRect(px+10,py+9,12,7);      // face
  ctx.fillStyle='#1565c0'; ctx.fillRect(px+9,py+15,14,11);     // body
  ctx.fillStyle='#333'; ctx.fillRect(px+10,py+25,5,5); ctx.fillRect(px+17,py+25,5,5); // legs
  // facing eyes
  ctx.fillStyle='#000';
  if(G.dir==='down'){ctx.fillRect(px+12,py+12,2,2);ctx.fillRect(px+18,py+12,2,2);}
  else if(G.dir==='up'){ctx.fillStyle='#8d3b1a';ctx.fillRect(px+10,py+9,12,4);}
  else if(G.dir==='left'){ctx.fillRect(px+11,py+12,2,2);}
  else{ctx.fillRect(px+19,py+12,2,2);}
}
let animT=0;
function render(){
  animT++;
  const camX=Math.max(0,Math.min(MAP_W-VIEW_W, G.x-(VIEW_W>>1)));
  const camY=Math.max(0,Math.min(MAP_H-VIEW_H, G.y-(VIEW_H>>1)));
  for(let vy=0;vy<VIEW_H;vy++)for(let vx=0;vx<VIEW_W;vx++){
    const mx=camX+vx, my=camY+vy;
    const t=(mx>=0&&my>=0&&mx<MAP_W&&my<MAP_H)?world[my][mx]:2;
    drawTile(t,vx*TILE,vy*TILE);
  }
  drawPlayer((G.x-camX)*TILE,(G.y-camY)*TILE);
}

//---------------------------------------------------------------- movement
let moving=false, busy=false;
function tryMove(dir){
  if(busy||moving||battle.active) return;
  G.dir=dir;
  const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[dir];
  const nx=G.x+d[0], ny=G.y+d[1];
  if(blocked(nx,ny)){ render(); return; }
  G.x=nx; G.y=ny; G.steps++;
  render();
  updateLoc();
  if(isTallGrass(nx,ny) && Math.random()<0.14) startWildBattle();
  else if(G.steps%25===0) save();
}
function updateLoc(){
  let name='Crater Wilds';
  if(G.x>=20&&G.x<=28&&G.y>=14&&G.y<=20) name='Crater Town';
  else if(world[G.y][G.x]===1) name='Tall Grass';
  else if(G.y<12) name='North Ridge';
  else if(G.y>26) name='South Basin';
  $('loc').textContent=name;
  $('money').textContent=G.money;
}
function interact(){
  if(busy) return;
  const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[G.dir];
  const tx=G.x+d[0], ty=G.y+d[1];
  const t=world[ty]&&world[ty][tx];
  if(t===6){ healParty(); dialogue("Welcome to the Pokémon Center! Your team is fully healed. ♥"); }
  else if(t===7){ openShop(); }
  else dialogue(["The crater stretches on...","Wild Pokémon hide in the tall grass.","A cool breeze blows across the basin.","You see meteor fragments glittering."][Math.floor(Math.random()*4)]);
}
function healParty(){ for(const m of G.party){ m.hp=m.maxhp; m.status=null; for(const mv of m.moves) mv.pp=mv.maxpp; } renderParty(); }

//---------------------------------------------------------------- dialogue

function showNextD(){

//---------------------------------------------------------------- flash toast
let toastT;

//================================================================ BATTLE ENGINE
const battle={active:false,foe:null,ally:null,phase:null,xpGain:0,canCatch:true};
function encounterPool(){
  // choose species by region (player y) present in dex with a sprite num
  const kanto=[]; for(const k in STATS){ const n=num(k); if(n>0&&n<=386) kanto.push(k); }
  return kanto;
}
function pickWild(){
  const pool=encounterPool();
  // weight toward earlier dex numbers (commoner)
  let sp, tries=0;
  do{ sp=pool[Math.floor(Math.random()*pool.length)]; tries++; }
  while(num(sp)>250 && Math.random()<0.7 && tries<8);
  let lvl=3+Math.floor(Math.random()*6);
  if(G.y<12) lvl+=4; if(G.y>28) lvl+=8;
  lvl=Math.min(60,lvl);
  return makeMon(sp,lvl);
}
function firstHealthy(){ return G.party.find(m=>m.hp>0); }
function startWildBattle(foe){
  foe=foe||pickWild(); if(!foe) return;
  const ally=firstHealthy(); if(!ally){ return; }
  battle.active=true; battle.foe=foe; battle.ally=ally; battle.canCatch=true;
  G.seen[foe.species]=1;
  $('battle').classList.add('show');
  setMonUI('foe',foe); setMonUI('ally',ally);
  $('allyXp').style.width=xpPct(ally)+'%';
  bText(`A wild ${DEX[foe.species.toLowerCase()]?.name||foe.species} appeared!`);
  setTimeout(()=>mainMenu(),700);
}
function setMonUI(side,m){
  const nm=DEX[m.species.toLowerCase()]?.name||m.species;
  $(side+'Name').textContent=cap(nm);
  $(side+'Lv').textContent='L'+m.level;
  $(side+'Hp').style.width=(100*m.hp/m.maxhp)+'%';
  $(side+'Hp').style.background=hpColor(m.hp/m.maxhp);
  $(side+'Img').src=spriteURL(m.species,side==='ally');
  if(side==='ally') $('allyHpTxt').textContent=`${m.hp}/${m.maxhp}`;
}
function hpColor(f){ return f>.5?'#66bb6a':f>.2?'#ffca28':'#ef5350'; }
function xpPct(m){ const cur=expForLevel(m.level), nxt=expForLevel(m.level+1);
  return Math.max(0,Math.min(100,100*(m.exp-cur)/(nxt-cur))); }
function bText(t){ $('btxt').textContent=t; }
function bMenu(items){ const el=$('bmenu'); el.innerHTML='';
  for(const it of items){ const b=document.createElement('button');
    b.innerHTML=it.label+(it.sub?`<small>${it.sub}</small>`:'');
    b.onclick=it.fn; el.appendChild(b); } }

function mainMenu(){
  bText(`What will ${cap(DEX[battle.ally.species.toLowerCase()]?.name||battle.ally.species)} do?`);
  bMenu([
    {label:'⚔ Fight',fn:moveMenu},
    {label:'🎒 Bag',fn:bagMenu},
    {label:'🔄 Party',fn:switchMenu},
    {label:'🏃 Run',fn:tryRun},
  ]);
}
function moveMenu(){
  const m=battle.ally;
  bMenu(m.moves.map(mv=>{ const md=MOVES[mv.id];
    return {label:cap(md.name),sub:`${md.type} · ${mv.pp}/${mv.maxpp}`,
      fn:()=>{ if(mv.pp<=0){flash('No PP left!');return;} playerTurn(mv); }}; })
    .concat([{label:'‹ Back',fn:mainMenu}]));
}
function bagMenu(){
  const items=Object.keys(G.bag).filter(k=>G.bag[k]>0);
  if(!items.length){ flash('Bag is empty!'); return; }
  bMenu(items.map(it=>({label:it,sub:'×'+G.bag[it],fn:()=>useItemBattle(it)}))
    .concat([{label:'‹ Back',fn:mainMenu}]));
}
function switchMenu(){
  bMenu(G.party.map((m,i)=>({label:cap(DEX[m.species.toLowerCase()]?.name||m.species),
    sub:m.hp>0?`L${m.level} ${m.hp}/${m.maxhp}`:'Fainted',
    fn:()=>{ if(m.hp<=0){flash('Fainted!');return;} if(m===battle.ally){flash('Already out!');return;}
      battle.ally=m; setMonUI('ally',m); $('allyXp').style.width=xpPct(m)+'%';
      bText('Go, '+cap(DEX[m.species.toLowerCase()]?.name||m.species)+'!'); enemyTurnThen(mainMenu); }}))
    .concat([{label:'‹ Back',fn:mainMenu}]));
}

function damage(att,def,mv){
  const md=MOVES[mv.id]; if(!md.power) return {dmg:0,e:1,crit:false};
  const as=calcStats(att), ds=calcStats(def);
  const phys=md.category==='physical';
  const A=phys?as.atk:as.spa, D=phys?ds.def:ds.spd;
  const stab=STATS[att.species].types.includes(md.type)?1.5:1;
  const e=eff(md.type,STATS[def.species].types);
  const crit=Math.random()<0.0625?1.5:1;
  const rand=0.85+Math.random()*0.15;
  let dmg=Math.floor((((2*att.level/5+2)*md.power*A/D)/50+2)*stab*e*crit*rand);
  return {dmg:Math.max(e===0?0:1,dmg),e,crit:crit>1};
}
function accHit(mv){ const a=MOVES[mv.id].accuracy; return a==null||a>=100?true:Math.random()*100<a; }

function playerTurn(mv){
  bMenu([]); mv.pp--;
  const first= calcStats(battle.ally).spe >= calcStats(battle.foe).spe;
  const seq=first?[['ally',mv],['foe',null]]:[['foe',null],['ally',mv]];
  runSeq(seq,0);
}
function enemyTurnThen(after){ // enemy attacks once (after switch/failed catch)
  doAttack('foe',null,()=>{ if(!checkFaint(after)) after&&after(); });
}
function runSeq(seq,i){
  if(i>=seq.length){ if(battle.active) mainMenu(); return; }
  const [side,mv]=seq[i];
  const attacker=side==='ally'?battle.ally:battle.foe;
  if(attacker.hp<=0){ runSeq(seq,i+1); return; }
  doAttack(side,mv,()=>{ if(checkFaint(()=>runSeq(seq,i+1))) return; runSeq(seq,i+1); });
}
function doAttack(side,mv,done){
  const att=side==='ally'?battle.ally:battle.foe;
  const def=side==='ally'?battle.foe:battle.ally;
  if(!mv){ // AI pick a move
    const usable=att.moves.filter(x=>x.pp>0); mv=usable.length?usable[Math.floor(Math.random()*usable.length)]:att.moves[0]; }
  if(mv.pp>0 && side==='foe') mv.pp--;
  const md=MOVES[mv.id];
  const attName=cap(DEX[att.species.toLowerCase()]?.name||att.species);
  bText(`${attName} used ${cap(md.name)}!`);
  if(!accHit(mv)){ setTimeout(()=>{ bText(`${attName}'s attack missed!`); setTimeout(done,700); },600); return; }
  const res=damage(att,def,mv);
  animShake(side==='ally'?'foe':'ally');
  def.hp=Math.max(0,def.hp-res.dmg);
  setTimeout(()=>{
    setMonUI(side==='ally'?'foe':'ally',def);
    let msg='';
    if(res.dmg>0){ if(res.e>1)msg='It\'s super effective! '; else if(res.e===0)msg='It had no effect...'; else if(res.e<1)msg='It\'s not very effective... '; if(res.crit)msg+='A critical hit! '; }
    else if(md.power) msg='It had no effect...';
    else msg='';
    if(msg) bText(bTextEl().textContent+' '+msg);
    setTimeout(done,700);
  },500);
}
function bTextEl(){ return $('btxt'); }
function checkFaint(cont){
  if(battle.foe.hp<=0){ onFoeFaint(); return true; }
  if(battle.ally.hp<=0){ onAllyFaint(cont); return true; }
  return false;
}
function onFoeFaint(){
  const foeName=cap(DEX[battle.foe.species.toLowerCase()]?.name||battle.foe.species);
  bText(`Wild ${foeName} fainted!`); bMenu([]);
  animFaint('foe');
  // exp
  const s=STATS[battle.foe.species];
  const gain=Math.floor((s.exp_yield? s.exp_yield/50 : (s.base_hp||50))* battle.foe.level/7)+battle.foe.level;
  setTimeout(()=>gainExp(battle.ally,gain,()=>endBattle()),900);
}
function gainExp(m,amount,done){
  if(m.hp<=0||m.level>=100){ done&&done(); return; }
  const before=m.level; m.exp+=amount;
  bText(`${cap(DEX[m.species.toLowerCase()]?.name||m.species)} gained ${amount} EXP!`);
  const target=levelForExp(m.exp);
  $('allyXp').style.width=xpPct(m)+'%';
  if(target>before){
    m.level=Math.min(100,target);
    const oldMax=m.maxhp; const st=calcStats(m); m.maxhp=st.hp; m.hp+=m.maxhp-oldMax;
    setMonUI('ally',m);
    setTimeout(()=>{ bText(`${cap(DEX[m.species.toLowerCase()]?.name||m.species)} grew to Lv.${m.level}!`);
      learnCheck(m,before,()=>{ done&&done(); }); },900);
  } else setTimeout(()=>done&&done(),900);
}
function learnCheck(m,fromLvl,done){
  const ls=LEARN[m.species.toLowerCase()]||[];
  const newMoves=ls.filter(e=>e[0]>fromLvl&&e[0]<=m.level&&MOVES[e[1]]).map(e=>e[1]);
  let idx=0;
  (function next(){
    if(idx>=newMoves.length){ done(); return; }
    const mvId=newMoves[idx++];
    if(m.moves.find(x=>x.id===mvId)){ next(); return; }
    if(m.moves.length<4){ m.moves.push({id:mvId,pp:MOVES[mvId].pp,maxpp:MOVES[mvId].pp});
      bText(`${cap(m.species)} learned ${cap(MOVES[mvId].name)}!`); setTimeout(next,900); }
    else { // replace weakest for simplicity
      m.moves.shift(); m.moves.push({id:mvId,pp:MOVES[mvId].pp,maxpp:MOVES[mvId].pp});
      bText(`${cap(m.species)} learned ${cap(MOVES[mvId].name)}!`); setTimeout(next,900); }
  })();
}
function onAllyFaint(cont){
  bText(`${cap(DEX[battle.ally.species.toLowerCase()]?.name||battle.ally.species)} fainted!`); bMenu([]);
  animFaint('ally');
  setTimeout(()=>{
    const next=firstHealthy();
    if(next){ battle.ally=next; setMonUI('ally',next); $('allyXp').style.width=xpPct(next)+'%';
      bText('Go, '+cap(DEX[next.species.toLowerCase()]?.name||next.species)+'!'); setTimeout(mainMenu,700); }
    else { bText('You have no Pokémon left! You scurry back to town...'); setTimeout(()=>{ healParty(); G.x=24;G.y=18; endBattle(); },1400); }
  },1000);
}
function tryRun(){
  bMenu([]);
  if(Math.random()<0.75){ bText('Got away safely!'); setTimeout(endBattle,700); }
  else { bText('Couldn\'t escape!'); setTimeout(()=>doAttack('foe',null,()=>{ if(!checkFaint(mainMenu)) mainMenu(); }),800); }
}
function endBattle(){
  battle.active=false; $('battle').classList.remove('show');
  save(); renderParty(); renderDex(); render();
}

//---------- catching
function useItemBattle(item){
  if(/Ball/.test(item)){ throwBall(item); return; }
  if(/Potion/.test(item)){
    const heal=item==='Super Potion'?60:20;
    const m=battle.ally; if(m.hp>=m.maxhp){flash('HP is full!');return;}
    G.bag[item]--; m.hp=Math.min(m.maxhp,m.hp+heal); setMonUI('ally',m);
    bText(`Used ${item}. Restored HP!`); bMenu([]); enemyTurnThen(mainMenu); return;
  }
  if(item==='Revive'){ flash('Use it from the Party menu.'); return; }
  flash('Nothing happened.');
}
function throwBall(ball){
  G.bag[ball]--; bMenu([]);
  bText(`You threw a ${ball}!`);
  const foe=battle.foe, s=STATS[foe.species];
  const rate=s.catch_rate||45;
  const ballMod=ball==='Great Ball'?1.5:ball==='Ultra Ball'?2:1;
  const hpFactor=(3*foe.maxhp-2*foe.hp)/(3*foe.maxhp);
  const a=hpFactor*rate*ballMod;
  const shakeP=Math.min(1,a/255);
  animThrow(()=>{
    let shakes=0; for(let i=0;i<4;i++){ if(Math.random()<Math.pow(shakeP,0.75)) shakes++; else break; }
    const caught = shakes>=4 || (a>=255);
    animShakeBall(shakes,()=>{
      if(caught){ bText(`Gotcha! ${cap(DEX[foe.species.toLowerCase()]?.name||foe.species)} was caught!`);
        catchMon(foe); setTimeout(endBattle,1400); }
      else { const msgs=['Oh no! It broke free!','Aww! So close!','Argh! Almost had it!','It escaped the ball!'];
        bText(msgs[shakes]||msgs[0]); setTimeout(()=>doAttack('foe',null,()=>{ if(!checkFaint(mainMenu)) mainMenu(); }),1000); }
    });
  });
}
function catchMon(foe){
  G.caught[foe.species]=1; G.seen[foe.species]=1;
  if(G.party.length<6) G.party.push(foe); else G.box.push(foe);
  renderParty(); renderDex();
}

function animShake(side){ const el=$(side+'Mon'); el.animate(
  [{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:250}); }
function animFaint(side){ $(side+'Img').animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(24px)'}],{duration:600,fill:'forwards'});

function renderDex(){

function openShop(){

//================================================================ input
const keymap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
let held=null,moveTimer=null;
function startHold(dir){ tryMove(dir); clearInterval(moveTimer); held=dir;
  moveTimer=setInterval(()=>{ if(held) tryMove(held); },160); }
function stopHold(){ held=null; clearInterval(moveTimer); }
document.addEventListener('keydown',e=>{
  if(battle.active) return;
  if($('dialogue').classList.contains('show')){ if(e.key===' '||e.key==='Enter'||e.key==='z'){ showNextD(); } return; }
  const dir=keymap[e.key];
  if(dir){ e.preventDefault(); if(held!==dir) startHold(dir); }
  else if(e.key==='z'||e.key===' '||e.key==='Enter') interact();
});
document.addEventListener('keyup',e=>{ if(keymap[e.key]) stopHold(); });
document.querySelectorAll('.dpad button[data-dir]').forEach(b=>{
  const dir=b.dataset.dir;
  b.addEventListener('touchstart',e=>{e.preventDefault();startHold(dir);},{passive:false});
  b.addEventListener('mousedown',e=>{e.preventDefault();startHold(dir);});
  b.addEventListener('touchend',e=>{e.preventDefault();stopHold();});
  b.addEventListener('mouseup',stopHold); b.addEventListener('mouseleave',stopHold);
});
$('btnA').onclick=()=>{ if($('dialogue').classList.contains('show')) showNextD(); else interact(); };
$('btnB').onclick=()=>{ if($('dialogue').classList.contains('show')) showNextD(); };
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openOverlay(b.dataset.open));
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeOverlay(b.dataset.close));
$('saveBtn').onclick=save;

//================================================================ boot / title
const STARTERS=['BULBASAUR','CHARMANDER','SQUIRTLE','PIKACHU','CHIKORITA','CYNDAQUIL','TOTODILE','TREECKO','TORCHIC','MUDKIP'];
function showTitle(){
  const hasSave=localStorage.getItem(SKEY);
  const body=$('titleBody');
  if(hasSave){
    body.innerHTML=`<button class="btn" id="continueBtn" style="font-size:16px;padding:12px 30px">▶ Continue</button>
      <div style="height:8px"></div><button class="btn grey" id="newBtn">✦ New Game</button>`;
    $('continueBtn').onclick=()=>{ load(); startGame(); };
    $('newBtn').onclick=chooseStarter;
  } else chooseStarter();
}
let selStarter=null;
function chooseStarter(){
  const body=$('titleBody');
  body.innerHTML=`<p style="color:var(--gold);font-weight:700;margin:0 0 6px">Choose your first partner!</p>
    <div class="starter" id="starterPick"></div>
    <div style="height:12px"></div><button class="btn" id="startBtn" style="opacity:.5;pointer-events:none;font-size:16px;padding:11px 26px">Start Adventure</button>`;
  const wrap=$('starterPick');
  STARTERS.forEach(sp=>{ if(!STATS[sp]) return;
    const d=document.createElement('div'); d.className='pick';
    d.innerHTML=`<img src="${spriteURL(sp)}"><div class="n">${cap(sp)}</div>
      <div class="small">${STATS[sp].types.join('/')}</div>`;
    d.onclick=()=>{ selStarter=sp; document.querySelectorAll('.pick').forEach(p=>p.classList.remove('sel'));
      d.classList.add('sel'); const b=$('startBtn'); b.style.opacity=1; b.style.pointerEvents='auto'; };
    wrap.appendChild(d);
  });
  $('startBtn').onclick=()=>{ if(!selStarter)return; newGame(selStarter); startGame(); };
}
function startGame(){
  $('title').style.display='none';
  updateLoc(); render(); renderParty(); renderBag(); renderDex();
  dialogue([`You wake up at the edge of Crater Town.`,`Wild Pokémon roam the tall grass all around.`,`Use the D-pad to walk, A to interact. Good luck, Trainer!`]);
}

//---- render loop (for water/anim)
function loop(){ if(G && !battle.active && $('title').style.display==='none') render(); requestAnimationFrame(loop); }

(async function(){
  genWorld();
  try{ await loadData(); }
  catch(e){ $('titleBody').innerHTML='<p style="color:#ef5350">Failed to load game data. Serve over http (GitHub Pages), not file://.</p>'; return; }
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
