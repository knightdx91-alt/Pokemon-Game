<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0e0e12">
<title>Pokémon Crater — RetroPlay</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23e62829'/><rect y='7' width='16' height='2' fill='%23111'/><circle cx='8' cy='8' r='2.6' fill='%23fff' stroke='%23111'/></svg>">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
        --bg: #0e0e12; --surface: #17171d; --surface2: #1f1f28;
        --border: #2a2a35; --text: #e8e8ef; --muted: #8b8b98;
        --accent: #7c6af7; --accent2: #4ecdc4; --gold: #f8d030;
    }
    html, body { height: 100%; }
    body {
        background: var(--bg); color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        display: flex; flex-direction: column;
    }
    img { image-rendering: pixelated; }
    button {
        font-family: inherit; color: var(--text); background: var(--surface2);
        border: 1px solid var(--border); border-radius: 10px; cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: default; }
    h2 { font-size: 1.05rem; margin: 10px 2px 8px; }
    small { color: var(--muted); }
    .muted { color: var(--muted); font-size: 0.85rem; padding: 6px 2px; }

    /* ---------- topbar ---------- */
    #topbar {
        display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
        padding: 8px 10px; background: var(--surface);
        border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50;
    }
    #tb-brand { font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent2));
        -webkit-background-clip: text; background-clip: text; color: transparent; margin-right: 4px; }
    #topbar .tb-stat { font-size: 0.8rem; color: var(--muted); margin-right: 6px; white-space: nowrap; }
    #topbar nav { display: flex; gap: 5px; flex-wrap: wrap; margin-left: auto; }
    #topbar nav button { padding: 6px 9px; font-size: 0.8rem; }
    #topbar nav button:active { background: var(--accent); }

    #screen { flex: 1; padding: 10px; max-width: 860px; width: 100%; margin: 0 auto; }
    #boot-msg { padding: 40px 20px; text-align: center; color: var(--muted); }

    /* ---------- title ---------- */
    .title-screen { text-align: center; padding-top: 8vh; }
    .title-logo { font-size: 2.6rem; font-weight: 900; letter-spacing: -1px; }
    .title-logo span { display: block; font-size: 3.4rem; background: linear-gradient(135deg, var(--gold), #f85040);
        -webkit-background-clip: text; background-clip: text; color: transparent; }
    .title-sub { color: var(--muted); margin: 10px 0 30px; font-size: 0.9rem; }
    .title-btns { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .big-btn { padding: 14px 30px; font-size: 1.05rem; min-width: 260px; }
    .big-btn small { display: block; font-size: 0.75rem; }
    .big-btn.primary { background: var(--accent); border-color: var(--accent); }
    .title-credit { color: var(--muted); font-size: 0.72rem; margin-top: 40px; padding: 0 20px; }

    /* ---------- starter ---------- */
    .starter-screen { text-align: center; }
    .name-row { margin: 8px 0 14px; }
    .name-input { padding: 10px 14px; font-size: 1rem; background: var(--surface2); color: var(--text);
        border: 1px solid var(--border); border-radius: 10px; width: min(320px, 90%); text-align: center; }
    .starter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 8px; }
    .starter-card { padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .starter-card img { width: 80px; height: 80px; }
    .starter-card:active { border-color: var(--accent); background: var(--surface); }
    .type-chip { font-size: 0.62rem; color: #fff; padding: 1px 6px; border-radius: 8px; margin: 0 1px;
        text-shadow: 0 1px 1px rgba(0,0,0,0.6); display: inline-block; }

    /* ---------- map ---------- */
    .region-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .region-tab { flex: 1; padding: 9px 0; font-weight: 700; }
    .region-tab.active { background: var(--accent); border-color: var(--accent); }
    .zone-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .zone-card { position: relative; padding: 10px; text-align: left; display: flex; flex-direction: column; gap: 2px;
        border-left: 4px solid var(--border); overflow: hidden; }
    .zone-card b { font-size: 0.85rem; }
    .zone-card small { font-size: 0.72rem; }
    .zone-card .z-ico { position: absolute; right: 8px; top: 8px; font-size: 1.1rem; opacity: 0.8; }
    .zone-card:active { background: var(--surface); }
    .zone-card.special { border-left-color: var(--gold); box-shadow: inset 0 0 18px rgba(248, 208, 48, 0.08); }
    .zone-card.locked { opacity: 0.55; }
    .zone-card .lock { font-size: 0.68rem; color: var(--gold); }
    .rare-hint { color: var(--gold); font-style: normal; }
    .env-grass { border-left-color: #3fa129; }
    .env-forest { border-left-color: #1d7a3a; }
    .env-cave { border-left-color: #8a6d4b; }
    .env-water { border-left-color: #2980ef; }
    .env-ice { border-left-color: #6fd8ff; }
    .env-volcano { border-left-color: #e05020; }
    .env-building { border-left-color: #9a8fd0; }
    .env-sand { border-left-color: #d8b048; }

    /* ---------- zone field ---------- */
    .zone-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .zone-title { font-size: 1rem; }
    .zone-btns { display: flex; gap: 6px; }
    .sm-btn { padding: 7px 11px; font-size: 0.82rem; }
    .sm-btn.primary { background: var(--accent); border-color: var(--accent); }
    .zone-field { position: relative; height: 340px; border-radius: 14px; border: 1px solid var(--border); overflow: hidden; }
    div.zone-field.env-grass { background: linear-gradient(180deg, #2c5e1e 0%, #38761f 55%, #2c5e1e 100%); }
    div.zone-field.env-forest { background: linear-gradient(180deg, #14351c 0%, #1d5029 60%, #143a1e 100%); }
    div.zone-field.env-cave { background: linear-gradient(180deg, #2a2118 0%, #4a3a28 60%, #2e2418 100%); }
    div.zone-field.env-water { background: linear-gradient(180deg, #123a6e 0%, #1c5eb0 60%, #123a6e 100%); }
    div.zone-field.env-ice { background: linear-gradient(180deg, #1e3d50 0%, #3d7ea0 60%, #24485c 100%); }
    div.zone-field.env-volcano { background: linear-gradient(180deg, #3a1410 0%, #7a2c14 60%, #401410 100%); }
    div.zone-field.env-building { background: linear-gradient(180deg, #1e1c2e 0%, #363050 60%, #232038 100%); }
    div.zone-field.env-sand { background: linear-gradient(180deg, #6e5a28 0%, #a8863c 60%, #6e5a28 100%); }
    .wild-spawn { position: absolute; background: none; border: none; display: flex; flex-direction: column;
        align-items: center; z-index: 2; }
    .wild-spawn img { width: 72px; height: 72px; filter: drop-shadow(0 3px 2px rgba(0,0,0,0.45)); }
    .wild-spawn:active img { transform: scale(1.1); }
    .wild-spawn .w-label { font-size: 0.62rem; background: rgba(0,0,0,0.55); padding: 1px 6px; border-radius: 8px;
        white-space: nowrap; margin-top: -6px; }
    .wild-spawn.rare .w-label { background: rgba(160, 120, 0, 0.8); }
    .wild-spawn.v-shiny .w-label { color: var(--gold); }
    .field-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.7); }
    .zone-tip { color: var(--muted); font-size: 0.74rem; margin-top: 8px; }
    .var-tag { font-size: 0.68em; font-weight: 800; padding: 0 4px; border-radius: 6px; background: #444; }
    .var-shiny { background: #a08000; } .var-dark { background: #222; }
    .var-mystic { background: #206090; } .var-metallic { background: #667; } .var-shadow { background: #4a2070; }

    /* ---------- battle ---------- */
    .battle { display: flex; flex-direction: column; gap: 8px; }
    .bt-arena { position: relative; height: 300px; border-radius: 14px; border: 1px solid var(--border);
        overflow: hidden; padding: 10px; }
    .bt-arena.env-grass { background: linear-gradient(180deg, #7ec0ff 0%, #b8dcff 42%, #38761f 42%, #2c5e1e 100%); }
    .bt-arena.env-forest { background: linear-gradient(180deg, #9db87a 0%, #c8d8a8 42%, #1d5029 42%, #143a1e 100%); }
    .bt-arena.env-cave { background: linear-gradient(180deg, #241c14 0%, #40342a 42%, #4a3a28 42%, #2e2418 100%); }
    .bt-arena.env-water { background: linear-gradient(180deg, #7ec0ff 0%, #b8dcff 42%, #1c5eb0 42%, #123a6e 100%); }
    .bt-arena.env-ice { background: linear-gradient(180deg, #b8e8ff 0%, #e8f8ff 42%, #3d7ea0 42%, #24485c 100%); }
    .bt-arena.env-volcano { background: linear-gradient(180deg, #58281c 0%, #904028 42%, #7a2c14 42%, #401410 100%); }
    .bt-arena.env-building { background: linear-gradient(180deg, #2c2840 0%, #443c60 42%, #363050 42%, #232038 100%); }
    .bt-arena.env-sand { background: linear-gradient(180deg, #a0d0f0 0%, #d0e8f8 42%, #a8863c 42%, #6e5a28 100%); }
    .bt-enemy { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start; }
    .bt-player { position: absolute; bottom: 6px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-end; }
    .bt-sprite { width: 140px; height: 140px; transition: opacity 0.3s, transform 0.15s; }
    .bt-sprite.back { width: 150px; height: 150px; }
    .bt-sprite.gone { opacity: 0; transform: translateY(40px); }
    .bt-sprite.atk-p { animation: atkP 0.3s; }
    .bt-sprite.atk-e { animation: atkE 0.3s; }
    .bt-sprite.hit { animation: hitFlash 0.35s; }
    @keyframes atkP { 40% { transform: translate(26px, -14px); } }
    @keyframes atkE { 40% { transform: translate(-26px, 14px); } }
    @keyframes hitFlash { 0%, 40%, 80% { opacity: 1; } 20%, 60% { opacity: 0.15; } }
    .bt-box { background: rgba(10, 10, 16, 0.82); border: 1px solid var(--border); border-radius: 10px;
        padding: 7px 10px; min-width: 170px; max-width: 230px; }
    .bt-nm { font-size: 0.8rem; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .g-M { color: #6fa8ff; font-style: normal; } .g-F { color: #ff8fb0; font-style: normal; }
    .hp-outer { height: 8px; background: #202028; border-radius: 5px; margin-top: 4px; overflow: hidden; }
    .hp-inner { height: 100%; border-radius: 5px; transition: width 0.4s; }
    .hp-num { font-size: 0.7rem; color: var(--muted); margin-top: 2px; text-align: right; }
    .exp-outer { height: 4px; background: #202028; border-radius: 3px; margin-top: 3px; overflow: hidden; }
    .exp-inner { height: 100%; background: #4090f0; transition: width 0.4s; }
    .status-tag { font-size: 0.6rem; font-weight: 800; color: #fff; padding: 0 4px; border-radius: 4px; }
    .bt-log { min-height: 40px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
        padding: 9px 12px; font-size: 0.88rem; }
    .bt-moves { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .bt-move { padding: 8px 10px; text-align: left; border-width: 2px; }
    .bt-move b { font-size: 0.85rem; display: block; }
    .bt-move span { font-size: 0.7rem; color: var(--muted); display: flex; gap: 5px; align-items: center; }
    .bt-move em { font-style: normal; }
    .bt-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
    .bt-cmd { padding: 9px 0; font-size: 0.82rem; }

    /* ---------- modal ---------- */
    #modal-layer { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex;
        align-items: center; justify-content: center; pointer-events: auto; padding: 16px; }
    .modal-win { background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
        width: min(420px, 100%); max-height: 82vh; overflow-y: auto; padding: 14px; display: flex;
        flex-direction: column; gap: 7px; }
    .modal-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
    .modal-opt { padding: 10px 12px; text-align: left; display: flex; align-items: center; gap: 9px; }
    .modal-opt b { font-size: 0.9rem; }
    .modal-opt small { display: block; color: var(--muted); font-size: 0.74rem; }
    .modal-opt.disabled { opacity: 0.45; }
    .modal-opt:active { border-color: var(--accent); }
    .opt-icon { width: 36px; height: 36px; }
    .modal-cancel { padding: 9px; color: var(--muted); }
    .detail-head { display: flex; gap: 10px; align-items: center; }
    .detail-head img { width: 90px; height: 90px; }
    .detail-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .detail-stats span { background: var(--surface2); border-radius: 8px; padding: 6px; text-align: center;
        font-weight: 700; display: flex; flex-direction: column; }
    .detail-stats em { font-style: normal; font-size: 0.65rem; color: var(--muted); }
    .detail-stats small { font-size: 0.62rem; font-weight: 400; }
    .detail-moves div { display: flex; align-items: center; gap: 6px; padding: 5px 2px; font-size: 0.82rem; }
    .detail-moves span { color: var(--muted); font-size: 0.72rem; margin-left: auto; }

    /* ---------- party / box ---------- */
    .party-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border);
        border-radius: 12px; padding: 8px 10px; margin-bottom: 7px; }
    .party-row > img { width: 44px; height: 44px; }
    .pr-mid { flex: 1; min-width: 0; font-size: 0.88rem; }
    .pr-btns { display: flex; gap: 5px; }
    .box-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin-top: 6px; }
    .box-cell { padding: 7px 3px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.7rem; }
    .box-cell img { width: 36px; height: 36px; }

    /* ---------- dex ---------- */
    .dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 5px; }
    .dex-cell { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 6px 2px;
        display: flex; flex-direction: column; align-items: center; font-size: 0.64rem; color: var(--muted); }
    .dex-cell img { width: 34px; height: 34px; }
    .dex-cell b { font-size: 0.66rem; color: var(--text); font-weight: 600; text-align: center; }
    .dex-cell.unseen img { filter: brightness(0) opacity(0.35); }
    .dex-cell.unseen b { color: var(--muted); }

    /* ---------- mart / gyms ---------- */
    .mart-row, .gym-row { display: flex; align-items: center; gap: 10px; background: var(--surface);
        border: 1px solid var(--border); border-radius: 12px; padding: 9px 11px; margin-bottom: 7px; }
    .mr-mid, .gym-mid { flex: 1; min-width: 0; font-size: 0.9rem; }
    .mr-mid small, .gym-mid small { display: block; font-size: 0.74rem; }
    .gym-team { display: flex; gap: 4px; margin: 4px 0; flex-wrap: wrap; }
    .gym-mon { position: relative; }
    .gym-mon img { width: 32px; height: 32px; }
    .gym-mon i { position: absolute; bottom: -3px; right: -3px; font-size: 0.58rem; font-style: normal;
        background: var(--surface2); border-radius: 5px; padding: 0 3px; }
    .gym-row.beaten { border-color: #2f6f3f; }
    .gym-row.locked { opacity: 0.55; }
</style>
</head>
<body>

<header id="topbar" style="display:none">
    <span id="tb-brand">Crater</span>
    <span class="tb-stat" id="tb-name"></span>
    <span class="tb-stat" id="tb-money"></span>
    <span class="tb-stat" id="tb-badges"></span>
    <span class="tb-stat" id="tb-dex"></span>
    <nav>
        <button id="nav-map">🗺 Map</button>
        <button id="nav-party">👥 Party</button>
        <button id="nav-dex">📕 Dex</button>
        <button id="nav-mart">🏪 Mart</button>
        <button id="nav-gyms">🏅 Gyms</button>
        <button id="nav-heal">❤ Heal</button>
        <button id="nav-title">⏻</button>
    </nav>
</header>

<main id="screen">
    <div id="boot-msg">Loading Pokémon data…</div>
</main>
<div id="modal-layer"></div>

<script src="src/crater/zones_gen.js?v=__CACHE_BUST__"></script>
<script src="src/crater/sprites.js?v=__CACHE_BUST__"></script>
<script src="src/crater/data.js?v=__CACHE_BUST__"></script>
<script src="src/crater/pokemon.js?v=__CACHE_BUST__"></script>
<script src="src/crater/battle.js?v=__CACHE_BUST__"></script>
<script src="src/crater/game.js?v=__CACHE_BUST__"></script>
<script src="src/crater/ui.js?v=__CACHE_BUST__"></script>
<script src="src/crater/main.js?v=__CACHE_BUST__"></script>
</body>
</html>
