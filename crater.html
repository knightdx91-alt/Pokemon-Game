<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0e0e12">
<title>Pokémon Crater — RetroPlay</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23e62829'/><rect y='7' width='16' height='2' fill='%23111'/><circle cx='8' cy='8' r='2.6' fill='%23fff' stroke='%23111'/></svg>">
<link rel="stylesheet" href="styles.css?v=__CACHE_BUST__">
<style>
    /* =====================================================================
       Pokémon Crater v2 — walkable overworld, pret-pokeemerald UI skin.
       Every window, menu and battle screen is styled after the real
       Pokémon Emerald (pret decomp) interface:
       - window frames:  src/assets/emerald_ui/frame1.png (text_window/1.png)
       - healthboxes:    src/assets/emerald_ui/healthbox_*.png
       - palettes:       text_pal1.pal / hpbar_anim / textbox_0.pal
       - font:           the bundled Gen-3 GBA font (src/assets/fonts/)
       ===================================================================== */
    @font-face {
        font-family: 'PokeGen3';
        /* generated by tools/gen_gen3_font.py from the authentic Gen-3
           bitmap atlas — pixel-perfect at multiples of font-size 16px */
        src: url('src/assets/fonts/gen3.ttf') format('truetype');
    }
    :root {
        /* text_pal1.pal: fg 98,98,98 / shadow 213,213,205 / red 230,8,8 */
        --em-text: #626262; --em-shadow: #d5d5cd; --em-red: #e00808;
        --em-white-sh: #6a6a6a;
        /* hpbar_anim.pal fills */
        --hp-green-a: #73ffac; --hp-green-b: #5ad583;
        --hp-yellow-a: #ffe639; --hp-yellow-b: #cdac08;
        --hp-red-a: #ff5a39; --hp-red-b: #ac414a;
        --exp-a: #41cdff; --exp-b: #1890d5;
        /* battle textbox (textbox_0.pal) */
        --btb-blue-a: #6a8bbd; --btb-blue-b: #52629c;
        --btb-red: #d54a39; --btb-teal: #6aa4a4;
    }
    #screen, #modal-layer, #topbar {
        font-family: 'PokeGen3', 'Courier New', monospace;
        font-size: 16px; line-height: 1.15; color: var(--em-text);
        text-shadow: 1px 1px 0 var(--em-shadow);
        user-select: none; -webkit-user-select: none;
    }
    #screen img, #modal-layer img, #topbar img { image-rendering: pixelated; }

    /* ---- the Emerald window: white body + text_window frame 1 ---- */
    .ew, #screen button, #modal-layer button {
        border: 6px solid transparent;
        border-image: url('src/assets/emerald_ui/frame1.png') 8 stretch;
        background: #fff; background-clip: padding-box;
        image-rendering: pixelated;
    }
    #screen button, #modal-layer button, #topbar button {
        font-family: inherit; color: var(--em-text); text-shadow: 1px 1px 0 var(--em-shadow);
        cursor: pointer; border-radius: 0;
    }
    #screen button:disabled, #modal-layer button:disabled { opacity: 0.5; cursor: default; }
    #screen h2 { font-size: 16px; margin: 10px 2px 8px; color: #f8f8f8;
        text-shadow: 1px 1px 0 var(--em-white-sh); font-weight: normal; }
    #screen small, #modal-layer small { font-size: 16px; }
    .muted { font-size: 16px; padding: 6px 2px; color: #f0f0e8; text-shadow: 1px 1px 0 #405048; }
    /* red ▶ selection cursor, exactly like Emerald menus */
    .em-cursor::before, .modal-opt:not(.disabled):hover::before, .modal-opt:not(.disabled):active::before {
        content: '▶'; color: var(--em-red); text-shadow: none;
        margin-right: 5px; font-size: 12px;
    }

    /* ---------- topbar: a slim Emerald window strip ---------- */
    #topbar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 260;
        display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
        padding: 4px 8px; background: #fff;
        border: 6px solid transparent; border-bottom-width: 6px;
        border-image: url('src/assets/emerald_ui/frame1.png') 8 stretch;
        font-size: 16px;
    }
    #tb-brand { color: #187848; text-shadow: 1px 1px 0 var(--em-shadow); margin-right: 4px; }
    #topbar .tb-stat { margin-right: 6px; white-space: nowrap; }
    #topbar nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
    #topbar nav button { padding: 2px 6px; font-size: 16px; border-width: 4px; }
    #topbar nav button:active { color: var(--em-red); }

    /* ---------- crater overlay screen ---------- */
    /* Above the on-screen gamepad (z 200) — crater screens own the display.
       Backdrop: the Emerald multichoice-menu green checker. */
    #screen {
        position: fixed; inset: 0; z-index: 250; overflow-y: auto;
        background: #18a068
            repeating-conic-gradient(#18a068 0% 25%, #109058 0% 50%) 0 0 / 16px 16px;
        padding: 54px 10px 16px;
    }
    #screen:empty { display: none; }
    #screen > * { max-width: 720px; margin-left: auto; margin-right: auto; }
    #boot-msg { padding: 40px 20px; text-align: center; color: #fff; text-shadow: 1px 1px 0 #405048; }
    .world-back-bar { display: flex; justify-content: flex-end; margin-bottom: 6px; }
    .world-back-btn { padding: 4px 12px; font-size: 16px; }

    /* ---------- title ---------- */
    .title-screen { text-align: center; padding-top: 7vh; }
    .title-logo { font-size: 44px; color: #f8e858; letter-spacing: 1px;
        text-shadow: 2px 2px 0 #a83820, -2px -2px 0 #a83820, 2px -2px 0 #a83820, -2px 2px 0 #a83820, 4px 4px 0 rgba(0,0,0,0.35); }
    .title-logo span { display: block; font-size: 30px; color: #f8f8f8; letter-spacing: 8px;
        text-shadow: 2px 2px 0 #106048, -2px -2px 0 #106048, 2px -2px 0 #106048, -2px 2px 0 #106048; margin-top: 2px; }
    .title-sub { color: #e8f8e8; text-shadow: 1px 1px 0 #106048; margin: 12px 0 26px; font-size: 16px; }
    .title-btns { display: flex; flex-direction: column; gap: 10px; align-items: center; }
    .big-btn { padding: 10px 24px; font-size: 16px; min-width: 270px; text-align: left; }
    .big-btn small { display: block; font-size: 16px; }
    .title-credit { color: #d0e8d8; text-shadow: 1px 1px 0 #106048; font-size: 16px; margin-top: 36px; padding: 0 20px; }

    /* ---------- starter ---------- */
    .starter-screen { text-align: center; }
    .name-row { margin: 8px 0 14px; }
    .name-input { padding: 8px 14px; font-size: 16px; color: var(--em-text);
        font-family: inherit; text-align: center; width: min(320px, 90%);
        border: 6px solid transparent; border-image: url('src/assets/emerald_ui/frame1.png') 8 stretch;
        background: #fff; background-clip: padding-box; }
    .starter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 8px; }
    .starter-card { padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 16px; }
    .starter-card:active { color: var(--em-red); }
    .starter-card img { width: 80px; height: 80px; }
    .type-chip { font-size: 12px; color: #fff; padding: 1px 6px; border-radius: 2px; margin: 0 1px;
        text-shadow: 1px 1px 0 rgba(0,0,0,0.55); display: inline-block; }
    .var-tag { font-size: 0.68em; padding: 0 4px; border-radius: 2px; background: #444; color: #fff; text-shadow: none; }
    .var-shiny { background: #a08000; } .var-dark { background: #222; }
    .var-mystic { background: #206090; } .var-metallic { background: #667; } .var-shadow { background: #4a2070; }
    .rare-hint { color: #f8d030; font-style: normal; }

    /* =====================================================================
       BATTLE — a real 240×160 GBA stage, scaled to fit, with the authentic
       Emerald healthboxes / HP-EXP bars / battle textbox / command windows.
       All inner coordinates are GBA pixels.
       ===================================================================== */
    .battle { display: flex; justify-content: center; }
    .eb-outer { width: 100%; max-width: 720px; }
    .eb-stage-wrap { position: relative; width: 100%; overflow: hidden; }
    .eb-stage { position: absolute; top: 0; left: 0; width: 240px; height: 160px;
        transform-origin: 0 0; image-rendering: pixelated; }
    .eb-stage, .eb-stage * { image-rendering: pixelated; }

    /* --- terrain backdrops: sky + ground band, Emerald-toned per env --- */
    .eb-field { position: absolute; inset: 0 0 48px 0; overflow: hidden; }
    .env-grass    .eb-field { background: linear-gradient(180deg, #a8d8f8 0%, #d0ecf8 55%, #58b048 55%, #409038 100%); }
    .env-forest   .eb-field { background: linear-gradient(180deg, #88b890 0%, #c0d8b0 55%, #287840 55%, #1d5c30 100%); }
    .env-cave     .eb-field { background: linear-gradient(180deg, #302418 0%, #584838 55%, #705838 55%, #483020 100%); }
    .env-water    .eb-field { background: linear-gradient(180deg, #a8d8f8 0%, #d0ecf8 55%, #3078c8 55%, #205898 100%); }
    .env-ice      .eb-field { background: linear-gradient(180deg, #c0e8f8 0%, #e8f8ff 55%, #68a8c8 55%, #487898 100%); }
    .env-volcano  .eb-field { background: linear-gradient(180deg, #683028 0%, #a05030 55%, #883018 55%, #501810 100%); }
    .env-building .eb-field { background: linear-gradient(180deg, #405078 0%, #6878a8 55%, #505878 55%, #303850 100%); }
    .env-sand     .eb-field { background: linear-gradient(180deg, #b8d8f0 0%, #e0f0f8 55%, #c0a050 55%, #907030 100%); }
    /* mon platforms (battle bases) */
    .eb-base { position: absolute; border-radius: 50%; opacity: 0.55; background: rgba(0,0,0,0.35); }
    .eb-base.enemy { left: 138px; top: 60px; width: 92px; height: 22px; }
    .eb-base.player { left: -10px; top: 122px; width: 120px; height: 26px; }

    /* --- sprites --- */
    .eb-esprite { position: absolute; left: 152px; top: 12px; width: 64px; height: 64px; }
    .eb-psprite { position: absolute; left: 22px; top: 56px; width: 64px; height: 64px; }
    .eb-esprite, .eb-psprite { transition: opacity 0.3s, transform 0.15s; }
    .eb-esprite.gone, .eb-psprite.gone { opacity: 0; transform: translateY(24px); }
    .eb-esprite.atk-e { animation: atkE 0.3s; }
    .eb-psprite.atk-p { animation: atkP 0.3s; }
    .eb-esprite.hit, .eb-psprite.hit { animation: hitFlash 0.35s; }
    @keyframes atkP { 40% { transform: translate(10px, -6px); } }
    @keyframes atkE { 40% { transform: translate(-10px, 6px); } }
    @keyframes hitFlash { 0%, 40%, 80% { opacity: 1; } 20%, 60% { opacity: 0.15; } }

    /* --- healthboxes (real Emerald graphics) --- */
    .eb-ebox { position: absolute; left: 8px; top: 14px; width: 128px; height: 32px;
        background: url('src/assets/emerald_ui/healthbox_opponent.png'); }
    .eb-pbox { position: absolute; left: 126px; top: 66px; width: 128px; height: 64px;
        background: url('src/assets/emerald_ui/healthbox_player.png'); }
    .eb-name { position: absolute; left: 6px; top: -3px; font-size: 16px; line-height: 16px;
        font-family: 'PokeGen3', monospace; color: #424242; text-shadow: 1px 1px 0 #d8d0b0;
        white-space: nowrap; text-transform: uppercase; max-width: 64px; overflow: hidden; }
    .eb-pbox .eb-name { left: 14px; top: -1px; }
    .eb-lv { position: absolute; right: 30px; top: -3px; font-size: 16px; line-height: 16px;
        color: #424242; text-shadow: 1px 1px 0 #d8d0b0; }
    .eb-ebox .eb-lv { right: 32px; }
    .eb-pbox .eb-lv { right: 30px; top: -1px; }
    .g-M { color: #3860c8; font-style: normal; text-shadow: 1px 1px 0 #d8d0b0; }
    .g-F { color: #e04068; font-style: normal; text-shadow: 1px 1px 0 #d8d0b0; }
    /* HP label + track: label graphic + CSS track with hpbar_anim palette */
    .eb-hp { position: absolute; }
    .eb-ebox .eb-hp { left: 16px; top: 17px; }
    .eb-pbox .eb-hp { left: 30px; top: 19px; }
    .eb-hp img { width: 16px; height: 8px; vertical-align: top; }
    .eb-track { position: absolute; left: 16px; top: 1px; width: 50px; height: 6px;
        background: #4a415a; border: 1px solid #fff; border-radius: 2px; box-sizing: border-box; }
    .eb-fill { height: 100%; width: 100%; border-radius: 1px;
        background: linear-gradient(180deg, var(--hp-green-a) 0 50%, var(--hp-green-b) 50% 100%);
        transition: width 0.4s; }
    .eb-fill.hp-yellow { background: linear-gradient(180deg, var(--hp-yellow-a) 0 50%, var(--hp-yellow-b) 50% 100%); }
    .eb-fill.hp-red { background: linear-gradient(180deg, var(--hp-red-a) 0 50%, var(--hp-red-b) 50% 100%); }
    .eb-hpnum { position: absolute; right: 30px; top: 20px; font-size: 16px; line-height: 16px;
        color: #424242; text-shadow: 1px 1px 0 #d8d0b0; }
    .eb-exp { position: absolute; left: 40px; top: 33px; width: 64px; height: 3px; }
    .eb-exp div { height: 100%; background: linear-gradient(180deg, var(--exp-a) 0 60%, var(--exp-b) 60% 100%);
        transition: width 0.4s; }
    .eb-status { position: absolute; left: 6px; top: 16px; width: 24px; height: 8px;
        background-image: url('src/assets/emerald_ui/status.png'); background-repeat: no-repeat; }
    .eb-pbox .eb-status { left: 14px; top: 18px; }
    .st-psn { background-position: 0 0; } .st-par { background-position: 0 -8px; }
    .st-slp { background-position: 0 -16px; } .st-frz { background-position: 0 -24px; }
    .st-brn { background-position: 0 -32px; }
    .eb-caught { position: absolute; left: 4px; top: 18px; width: 8px; height: 8px;
        background: url('src/assets/emerald_ui/ball_caught.png'); }

    /* --- bottom 48px: Emerald battle textbox / command / move windows --- */
    .eb-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 48px;
        background: var(--btb-blue-b); }
    .eb-msg { position: absolute; inset: 0; padding: 8px 10px;
        background: linear-gradient(180deg, var(--btb-blue-a), var(--btb-blue-b));
        border: 2px solid var(--btb-red); outline: 2px solid #303030; outline-offset: -1px;
        box-shadow: inset 0 0 0 2px var(--btb-teal); box-sizing: border-box;
        font-size: 16px; line-height: 14px; color: #f8f8f8; text-shadow: 1px 1px 0 #383838; }
    /* command phase: msg on the left, white 2×2 window on the right */
    .eb-msg.half { right: 116px; }
    .eb-cmd { position: absolute; right: 0; bottom: 0; width: 116px; height: 48px;
        background: #fff; border: 5px solid transparent; box-sizing: border-box;
        border-image: url('src/assets/emerald_ui/frame1.png') 8 stretch;
        display: grid; grid-template-columns: 1fr 1fr; align-content: space-around; }
    #screen .eb-cmd button, #screen .eb-moves button {
        all: unset; box-sizing: border-box; cursor: pointer; font-family: 'PokeGen3', monospace;
        font-size: 16px; line-height: 15px; color: #424242; text-shadow: 1px 1px 0 #d5d5cd;
        white-space: nowrap; overflow: hidden; padding-left: 8px; position: relative;
    }
    #screen .eb-cmd button::before, #screen .eb-moves button::before {
        content: '▶'; color: transparent; position: absolute; left: 0; top: 0; font-size: 16px; text-shadow: none;
    }
    #screen .eb-cmd button:hover::before, #screen .eb-cmd button:active::before,
    #screen .eb-moves button:hover::before, #screen .eb-moves button:active::before { color: #303030; }
    #screen .eb-cmd button:disabled, #screen .eb-moves button:disabled { opacity: 0.5; cursor: default; }
    /* move phase: white move grid left, PP/type box right */
    .eb-moves { position: absolute; left: 0; bottom: 0; width: 152px; height: 48px;
        background: #fff; border: 5px solid transparent; box-sizing: border-box;
        border-image: url('src/assets/emerald_ui/frame1.png') 8 stretch;
        display: grid; grid-template-columns: 1fr 1fr; align-content: space-around; }
    .eb-ppbox { position: absolute; right: 0; bottom: 0; width: 88px; height: 48px;
        background: #fff; border: 5px solid transparent; box-sizing: border-box;
        border-image: url('src/assets/emerald_ui/frame1.png') 8 stretch;
        font-size: 16px; line-height: 12px; color: #424242; text-shadow: 1px 1px 0 #d5d5cd;
        padding: 3px 4px; }
    .eb-ppbox .pp-num { float: right; }
    .eb-ppbox .pp-back { color: var(--em-red); cursor: pointer; }

    /* ---------- modal: Emerald choice/message windows ---------- */
    #modal-layer { position: fixed; inset: 0; z-index: 320; pointer-events: none; }
    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.35); display: flex;
        align-items: center; justify-content: center; pointer-events: auto; padding: 16px; }
    .modal-win { width: min(400px, 100%); max-height: 82vh; overflow-y: auto;
        padding: 8px 10px; display: flex; flex-direction: column; gap: 2px;
        border: 8px solid transparent; border-image: url('src/assets/emerald_ui/frame1.png') 8 stretch;
        background: #fff; background-clip: padding-box; }
    .modal-title { font-size: 16px; margin-bottom: 6px; }
    .modal-opt { border: none !important; border-image: none !important; background: none !important;
        padding: 5px 4px; text-align: left; display: flex; align-items: center; gap: 8px; font-size: 16px; }
    .modal-opt small { display: block; font-size: 16px; }
    .modal-opt.disabled { opacity: 0.5; }
    .opt-icon { width: 32px; height: 32px; }
    .modal-cancel { border: none !important; border-image: none !important; background: none !important;
        padding: 6px 4px; text-align: left; font-size: 16px; }
    .modal-cancel:hover::before, .modal-cancel:active::before {
        content: '▶'; color: var(--em-red); text-shadow: none; margin-right: 5px; font-size: 12px; }
    .detail-head { display: flex; gap: 10px; align-items: center; }
    .detail-head img { width: 80px; height: 80px; }
    .detail-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .detail-stats span { background: #f0f0e8; padding: 4px; text-align: center; display: flex; flex-direction: column; font-size: 16px; }
    .detail-stats em { font-style: normal; font-size: 16px; }
    .detail-stats small { font-size: 12px; }
    .detail-moves div { display: flex; align-items: center; gap: 6px; padding: 4px 2px; font-size: 16px; }
    .detail-moves span { font-size: 12px; margin-left: auto; }

    /* ---------- shared white-window rows (party/mart/gyms) ---------- */
    .party-row, .mart-row, .gym-row {
        display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
        border: 6px solid transparent; border-image: url('src/assets/emerald_ui/frame1.png') 8 stretch;
        background: #fff; background-clip: padding-box; padding: 4px 8px;
    }
    .party-row > img { width: 40px; height: 40px; }
    .pr-mid { flex: 1; min-width: 0; font-size: 16px; }
    .pr-btns { display: flex; gap: 4px; }
    .sm-btn { padding: 4px 9px; font-size: 16px; border-width: 4px !important; }
    .sm-btn:active { color: var(--em-red); }
    /* party HP bars reuse the battle track */
    .hp-outer { height: 6px; background: #4a415a; border: 1px solid #fff; border-radius: 2px;
        margin-top: 3px; overflow: hidden; box-sizing: content-box; max-width: 160px; }
    .hp-inner { height: 100%; transition: width 0.4s; }
    .status-tag { font-size: 10px; color: #fff; padding: 0 4px; border-radius: 2px; text-shadow: none; }
    .box-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 5px; margin-top: 6px; }
    .box-cell { padding: 4px 3px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; }
    .box-cell img { width: 36px; height: 36px; }

    /* ---------- dex ---------- */
    .dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 4px; }
    .dex-cell { border: 5px solid transparent; border-image: url('src/assets/emerald_ui/frame1.png') 8 stretch;
        background: #fff; background-clip: padding-box; padding: 3px 2px;
        display: flex; flex-direction: column; align-items: center; font-size: 12px; }
    .dex-cell img { width: 34px; height: 34px; }
    .dex-cell b { font-size: 12px; font-weight: normal; text-align: center; }
    .dex-cell.unseen img { filter: brightness(0) opacity(0.35); }

    /* ---------- mart / gyms ---------- */
    .mr-mid, .gym-mid { flex: 1; min-width: 0; font-size: 16px; }
    .mr-mid small, .gym-mid small { display: block; font-size: 12px; }
    .gym-team { display: flex; gap: 4px; margin: 4px 0; flex-wrap: wrap; }
    .gym-mon { position: relative; }
    .gym-mon img { width: 32px; height: 32px; }
    .gym-mon i { position: absolute; bottom: -3px; right: -3px; font-size: 9px; font-style: normal;
        background: #f0f0e8; padding: 0 3px; }
    .gym-row.beaten { filter: none; }
    .gym-row.beaten .gym-mid b::after { content: ' ✔'; color: #20a048; text-shadow: none; }
    .gym-row.locked { opacity: 0.6; }
</style>
</head>
<body>

    <!-- Crater topbar — shown only over crater screens (menus/battle), never the world -->
    <header id="topbar" style="display:none">
        <span id="tb-brand">Crater</span>
        <span class="tb-stat" id="tb-name"></span>
        <span class="tb-stat" id="tb-money"></span>
        <span class="tb-stat" id="tb-badges"></span>
        <span class="tb-stat" id="tb-dex"></span>
        <nav>
            <button id="nav-world">WORLD</button>
            <button id="nav-party">POKéMON</button>
            <button id="nav-dex">DEX</button>
            <button id="nav-mart">MART</button>
            <button id="nav-gyms">GYMS</button>
            <button id="nav-heal">HEAL</button>
            <button id="nav-title">EXIT</button>
        </nav>
    </header>

    <div id="game-wrapper">
        <!-- Primary game screen -->
        <div id="screen-primary">
            <div class="drag-handle" aria-label="Drag screen">&#9776;</div>
            <canvas id="canvas-primary"></canvas>
        </div>
        <!-- Secondary screen — unused here, kept for layout.js compatibility -->
        <div id="screen-secondary" class="hidden">
            <div class="drag-handle" aria-label="Drag secondary screen">&#9776;</div>
            <canvas id="canvas-secondary"></canvas>
        </div>
    </div><!-- #game-wrapper -->

    <!-- On-screen controls — static HTML, wired by controls.js -->
    <div id="controls-layer">
        <div id="gp-dpad">
            <button id="gp-up"    class="gp-btn" aria-label="Up">▲</button>
            <div id="gp-middle">
                <button id="gp-left"  class="gp-btn" aria-label="Left">◄</button>
                <div    id="gp-center-dot"></div>
                <button id="gp-right" class="gp-btn" aria-label="Right">►</button>
            </div>
            <button id="gp-down"  class="gp-btn" aria-label="Down">▼</button>
        </div>
        <button id="gp-a" class="gp-btn" aria-label="A">A</button>
        <button id="gp-b" class="gp-btn" aria-label="B">B</button>
        <button id="gp-l" class="gp-btn" aria-label="L">L</button>
        <button id="gp-r" class="gp-btn" aria-label="R">R</button>
        <button id="gp-start"  class="gp-btn" aria-label="Start">START</button>
        <button id="gp-select" class="gp-btn" aria-label="Select">SEL</button>
    </div>

    <!-- HUD overlay (map name, position, settings button) -->
    <div id="ui-overlay"></div>

    <!-- Settings panel (hidden by default) -->
    <div id="settings-panel" class="hidden" role="dialog" aria-label="Settings">
        <div class="settings-header">
            <span>Settings</span>
            <button id="settings-close" aria-label="Close settings">&times;</button>
        </div>
        <div class="settings-body">
            <div class="setting-row">
                <label>Controls</label>
                <div class="toggle-group">
                    <button class="toggle-btn active" id="toggle-dpad" data-mode="dpad">D-pad</button>
                    <button class="toggle-btn" id="toggle-joystick" data-mode="joystick">Joystick</button>
                </div>
            </div>
            <div class="setting-row">
                <label for="btn-size-slider">Button Size</label>
                <input type="range" id="btn-size-slider" min="0.6" max="1.8" step="0.1" value="1.0">
                <span id="btn-size-value">1.0&times;</span>
            </div>
            <div class="setting-row">
                <label>Orientation</label>
                <div class="toggle-group orient-group">
                    <button class="toggle-btn orient-btn active" data-orient="auto">Auto</button>
                    <button class="toggle-btn orient-btn" data-orient="portrait">Portrait</button>
                    <button class="toggle-btn orient-btn" data-orient="reverse-portrait">Rev. Portrait</button>
                    <button class="toggle-btn orient-btn" data-orient="landscape">Landscape</button>
                    <button class="toggle-btn orient-btn" data-orient="reverse-landscape">Rev. Landscape</button>
                </div>
            </div>
            <div class="setting-row" id="controls-opacity-row" style="display:none">
                <label for="controls-opacity-slider">Controls Opacity</label>
                <input type="range" id="controls-opacity-slider" min="0.1" max="1.0" step="0.05" value="0.65">
                <span id="controls-opacity-value">65%</span>
            </div>
            <div class="setting-row">
                <button id="customize-layout-btn" class="action-btn">Customize Buttons</button>
                <button id="reset-layout-btn" class="action-btn">Reset Layout</button>
            </div>
        </div>
    </div><!-- #settings-panel -->

    <!-- Crater overlay: title / starter / battle / party / dex / mart / gyms.
         Hidden automatically when empty (the world is playable underneath). -->
    <main id="screen">
        <div id="boot-msg">Loading Pokémon data…</div>
    </main>
    <div id="modal-layer"></div>
