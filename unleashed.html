<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pokémon Unleashed — New Bark</title>
<style>
  :root{--bar:40px;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#05070d;color:#dfe7f2;
    font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #bar{position:fixed;top:0;left:0;right:0;height:var(--bar);display:flex;align-items:center;
    gap:8px;padding:0 10px;background:linear-gradient(180deg,#14203a,#0c1424);
    box-shadow:0 2px 10px #0008;z-index:40;}
  #bar b{font-size:14px;color:#8fd0ff;} #bar .sub{font-size:10px;color:#6c7a92;}
  .btnsm{background:#111a2e;color:#9fb0cc;border:1px solid #2b3a5a;border-radius:7px;
    padding:6px 11px;font-size:12px;font-weight:600;}
  .toggle{margin-left:auto;display:flex;border:1px solid #2b3a5a;border-radius:8px;overflow:hidden;}
  .toggle button{background:#111a2e;color:#9fb0cc;border:0;padding:6px 13px;font-size:12px;font-weight:600;}
  .toggle button.on{background:#2563c9;color:#fff;}

  #stage{position:fixed;inset:var(--bar) 0 0 0;display:flex;flex-direction:column;}
  #topscreen{position:relative;flex:1 1 auto;min-height:0;background:#9bd4ee;overflow:hidden;}
  #gl{display:block;width:100%;height:100%;}
  #twod{position:absolute;inset:0;display:none;background:#101826;}
  #twod canvas{width:100%;height:100%;image-rendering:pixelated;object-fit:contain;}
  /* DS bottom screen (portrait only) */
  #botscreen{display:none;height:42%;flex:0 0 auto;background:#0a1120;
    border-top:3px solid #1a2c4d;padding:8px;}
  .ds-frame{width:100%;height:100%;border-radius:8px;background:linear-gradient(180deg,#12203a,#0b1526);
    border:2px solid #2a63b8;box-shadow:inset 0 0 0 2px #071022;display:grid;
    grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:8px;padding:12px;}
  .ds-btn{background:#0e1c34;border:1px solid #26456f;border-radius:8px;color:#bcd3f0;
    font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;}
  .ds-btn:active{background:#173a63;}

  #hud{position:fixed;left:8px;bottom:8px;font-size:11px;color:#7fe0a0;background:#0009;
    padding:5px 8px;border-radius:6px;font-variant-numeric:tabular-nums;z-index:40;}
  #err{position:fixed;inset:44px 12px auto 12px;color:#ff9a9a;font-size:13px;white-space:pre-wrap;z-index:50;}

  /* ---- controls ---- */
  #joy{position:absolute;left:14px;bottom:20px;width:130px;height:130px;z-index:30;display:none;touch-action:none;}
  #joy .stick{position:absolute;inset:0;border-radius:50%;background:#1a2740aa;border:2px solid #2b3a5a;}
  #joy .knob{position:absolute;width:52px;height:52px;left:39px;top:39px;border-radius:50%;background:#3a5488;border:2px solid #6c8fd0;}
  /* GBA cross d-pad (portrait) */
  #dpad{position:absolute;left:16px;bottom:18px;width:132px;height:132px;z-index:30;display:none;}
  #dpad button{position:absolute;background:#20304d;border:1px solid #3a5488;width:44px;height:44px;}
  #dpad .u{left:44px;top:0;border-radius:8px 8px 0 0;} #dpad .d{left:44px;top:88px;border-radius:0 0 8px 8px;}
  #dpad .l{left:0;top:44px;border-radius:8px 0 0 8px;} #dpad .r{left:88px;top:44px;border-radius:0 8px 8px 0;}
  #dpad .c{left:44px;top:44px;background:#20304d;border:1px solid #3a5488;}
  #dpad button:active{background:#3a5da0;}
  #ab{position:absolute;right:20px;bottom:24px;width:150px;height:110px;z-index:30;}
  #ab button{position:absolute;width:60px;height:60px;border-radius:50%;color:#fff;font-weight:800;font-size:20px;border:3px solid;}
  #btnA{right:0;bottom:0;background:#d64550;border-color:#ff8a92;}
  #btnB{right:70px;bottom:34px;background:#e0a025;border-color:#ffd27a;}
</style>
</head>
<body>
<div id="bar">
  <b>Pokémon Unleashed</b><span class="sub">New Bark Town</span>
  <button class="btnsm" id="orient" title="rotate">⟳</button>
  <div class="toggle"><button id="b3d" class="on">3D</button><button id="b2d">2.5D</button></div>
</div>
<div id="stage">
  <div id="topscreen">
    <canvas id="gl"></canvas>
    <div id="twod"><canvas id="twodc"></canvas></div>
    <!-- controls live over the top screen -->
    <div id="joy"><div class="stick"></div><div class="knob" id="knob"></div></div>
    <div id="dpad">
      <button class="u" data-k="up"></button><button class="d" data-k="down"></button>
      <button class="l" data-k="left"></button><button class="r" data-k="right"></button>
      <div class="c"></div>
    </div>
    <div id="ab"><button id="btnB">B</button><button id="btnA">A</button></div>
  </div>
  <div id="botscreen">
    <div class="ds-frame">
      <div class="ds-btn">Pokédex</div><div class="ds-btn">Pokémon</div><div class="ds-btn">Bag</div>
      <div class="ds-btn">Trainer</div><div class="ds-btn">Save</div><div class="ds-btn">Options</div>
    </div>
  </div>
</div>
<div id="hud">loading…</div>
<div id="err"></div>

<script src="src/vendor/three.min.js"></script>
<script>
const errEl=document.getElementById('err');
const fail=m=>{errEl.textContent='Error: '+m;console.error(m);};
window.addEventListener('error',e=>fail(e.message));

const GRID=32;
let map,renderer,scene,camera,playerSprite,twodOn=false;
let player={col:16,row:22,dir:'down',px:0,pz:0,moving:false,mt:0};
let world={minx:0,minz:0,tile:16};
let held={up:0,down:0,left:0,right:0};

const tileWorldX=c=>world.minx+(c+0.5)*world.tile;
const tileWorldZ=r=>world.minz+(r+0.5)*world.tile;
const blocked=(c,r)=>c<0||r<0||c>=GRID||r>=GRID||map.collision[r*GRID+c]===1;

function init(m){
  map=m; world.minx=m.bounds.minx; world.minz=m.bounds.minz; world.tile=m.tile;
  outer: for(let rad=0;rad<20;rad++)
    for(let r=22+rad;r>=22-rad;r--) for(let c=16-rad;c<=16+rad;c++)
      if(!blocked(c,r)){player.col=c;player.row=r;break outer;}
  player.px=tileWorldX(player.col); player.pz=tileWorldZ(player.row);

  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x9bd4ee);
  const loader=new THREE.TextureLoader(); let tris=0;
  for(const mesh of m.meshes){
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(Float32Array.from(mesh.positions),3));
    geo.setAttribute('uv',new THREE.BufferAttribute(Float32Array.from(mesh.uvs),2));
    let mat;
    if(mesh.texture){
      const tex=loader.load(mesh.texture);
      tex.magFilter=THREE.NearestFilter; tex.minFilter=THREE.NearestFilter;
      tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
      if('encoding' in tex) tex.encoding=THREE.sRGBEncoding;
      // buildings: single-sided front, opaque; terrain: double so no gaps
      mat=new THREE.MeshBasicMaterial({map:tex,side:mesh.building?THREE.DoubleSide:THREE.DoubleSide,
        alphaTest:0.5,depthWrite:true,transparent:false});
    } else mat=new THREE.MeshBasicMaterial({color:(mesh.color[0]<<16)|(mesh.color[1]<<8)|mesh.color[2],side:THREE.DoubleSide});
    scene.add(new THREE.Mesh(geo,mat)); tris+=mesh.positions.length/9;
  }
  buildPlayer(); scene.add(playerSprite);
  camera=new THREE.PerspectiveCamera(38,1,1,20000);
  window._tris=tris;
  applyLayout(); window.addEventListener('resize',applyLayout);
  last=performance.now(); animate();
}

function buildPlayer(){
  const cv=document.createElement('canvas'); cv.width=cv.height=64; const x=cv.getContext('2d');
  x.fillStyle='#2b6cff';x.fillRect(22,34,20,22); x.fillStyle='#ffd7a0';x.fillRect(24,22,16,12);
  x.fillStyle='#e23';x.fillRect(22,14,20,10); x.fillStyle='#e23';x.fillRect(38,18,8,4);
  const tex=new THREE.CanvasTexture(cv); tex.magFilter=THREE.NearestFilter; tex.minFilter=THREE.NearestFilter;
  const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,alphaTest:0.4,side:THREE.DoubleSide,depthWrite:false});
  const h=world.tile*2.3;
  playerSprite=new THREE.Mesh(new THREE.PlaneGeometry(h*0.72,h),mat);
  playerSprite.position.set(player.px,h*0.5,player.pz);
}

const CAM={dist:250,height:250,look:26};
function updateCamera(){
  const tx=playerSprite.position.x, tz=playerSprite.position.z;
  camera.position.set(tx,CAM.height,tz+CAM.dist); camera.lookAt(tx,CAM.look,tz);
}

// ---- responsive layout: portrait (dual screen + GBA dpad) vs landscape (joystick) ----
function applyLayout(){
  const portrait=window.innerHeight>window.innerWidth;
  document.getElementById('botscreen').style.display=portrait?'block':'none';
  document.getElementById('dpad').style.display=portrait?'block':'none';
  document.getElementById('joy').style.display=portrait?'none':'block';
  const ts=document.getElementById('topscreen');
  const w=ts.clientWidth,h=ts.clientHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  const tc=document.getElementById('twodc'); tc.width=w; tc.height=h;
}

const STEP_MS=170;
function tryStep(){
  if(player.moving) return;
  let dc=0,dr=0,dir=player.dir;
  if(held.up){dr=-1;dir='up';} else if(held.down){dr=1;dir='down';}
  else if(held.left){dc=-1;dir='left';} else if(held.right){dc=1;dir='right';}
  if(dc===0&&dr===0) return;
  player.dir=dir; const nc=player.col+dc,nr=player.row+dr;
  if(blocked(nc,nr)) return;
  player.fromX=player.px; player.fromZ=player.pz; player.col=nc; player.row=nr;
  player.toX=tileWorldX(nc); player.toZ=tileWorldZ(nr); player.moving=true; player.mt=0;
}
function stepAnim(dt){
  if(!player.moving) return;
  player.mt+=dt; const t=Math.min(1,player.mt/STEP_MS);
  player.px=player.fromX+(player.toX-player.fromX)*t;
  player.pz=player.fromZ+(player.toZ-player.fromZ)*t;
  if(t>=1){player.moving=false; tryStep();}
}
let last=0,frames=0,fps=0,facc=0;
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(),dt=now-last; last=now;
  if(!player.moving) tryStep(); stepAnim(dt);
  playerSprite.position.set(player.px,playerSprite.geometry.parameters.height*0.5,player.pz);
  updateCamera(); renderer.render(scene,camera);
  if(twodOn) draw2D();
  frames++; facc+=dt;
  if(facc>=500){fps=Math.round(frames*1000/facc);frames=0;facc=0;
    document.getElementById('hud').textContent=`${fps} fps · ${window._tris} tris · (${player.col},${player.row})`;}
}

let tdImg=new Image(); tdImg.src='data/unleashed/newbark_2d.png';
function draw2D(){
  const cv=document.getElementById('twodc'),g=cv.getContext('2d');
  const W=cv.width,H=cv.height; g.fillStyle='#101826'; g.fillRect(0,0,W,H);
  const side=Math.min(W,H),ox=(W-side)/2,oy=(H-side)/2;
  if(tdImg.complete&&tdImg.width) g.drawImage(tdImg,ox,oy,side,side);
  const gx=ox+(player.col+0.5)/GRID*side,gy=oy+(player.row+0.5)/GRID*side;
  g.fillStyle='#fff';g.beginPath();g.arc(gx,gy,side/GRID*0.4,0,7);g.fill();
  g.fillStyle='#e23';g.beginPath();g.arc(gx,gy,side/GRID*0.28,0,7);g.fill();
}

// keyboard
const KEY={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
addEventListener('keydown',e=>{const k=KEY[e.key];if(k){held[k]=1;e.preventDefault();}});
addEventListener('keyup',e=>{const k=KEY[e.key];if(k)held[k]=0;});

// GBA d-pad
document.querySelectorAll('#dpad button[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{held[k]=1;e.preventDefault();}, off=e=>{held[k]=0;e.preventDefault();};
  b.addEventListener('touchstart',on,{passive:false}); b.addEventListener('touchend',off);
  b.addEventListener('mousedown',on); b.addEventListener('mouseup',off); b.addEventListener('mouseleave',off);
});
// joystick
(function(){
  const pad=document.getElementById('joy'),knob=document.getElementById('knob');
  let active=false,cxp=0,cyp=0;
  const set=(dx,dy)=>{
    knob.style.left=(39+Math.max(-39,Math.min(39,dx)))+'px'; knob.style.top=(39+Math.max(-39,Math.min(39,dy)))+'px';
    const th=16; const hx=Math.abs(dx)>Math.abs(dy);
    held.left=(!hx?0:dx<-th)?1:0; held.right=(!hx?0:dx>th)?1:0;
    held.up=(hx?0:dy<-th)?1:0; held.down=(hx?0:dy>th)?1:0;
  };
  const start=e=>{active=true;const r=pad.getBoundingClientRect();cxp=r.left+65;cyp=r.top+65;move(e);};
  const move=e=>{if(!active)return;const t=e.touches?e.touches[0]:e;set(t.clientX-cxp,t.clientY-cyp);e.preventDefault();};
  const end=()=>{active=false;knob.style.left='39px';knob.style.top='39px';held.up=held.down=held.left=held.right=0;};
  pad.addEventListener('touchstart',start,{passive:false}); pad.addEventListener('touchmove',move,{passive:false});
  pad.addEventListener('touchend',end); pad.addEventListener('mousedown',start);
  addEventListener('mousemove',move); addEventListener('mouseup',end);
})();
document.getElementById('btnA').addEventListener('touchstart',e=>e.preventDefault());
// manual orientation cycle (portrait <-> landscape hint via body rotation)
let forced=0;
document.getElementById('orient').onclick=()=>{ applyLayout(); };

// toggles
const b3d=document.getElementById('b3d'),b2d=document.getElementById('b2d');
const gl=document.getElementById('gl'),twod=document.getElementById('twod');
b3d.onclick=()=>{twodOn=false;b3d.classList.add('on');b2d.classList.remove('on');gl.style.display='block';twod.style.display='none';};
b2d.onclick=()=>{twodOn=true;b2d.classList.add('on');b3d.classList.remove('on');gl.style.display='none';twod.style.display='block';};

fetch('data/unleashed/newbark.json').then(r=>{if(!r.ok)throw new Error('map '+r.status);return r.json();})
  .then(init).catch(e=>fail(e.message));
</script>
</body>
</html>
